name: RAG-MUNGIL Auto Harvester

on:
  schedule:
    # Berjalan otomatis setiap 2 jam sekali
    - cron: '0 */2 * * *'
  workflow_dispatch: # Tombol manual trigger dari HP

concurrency:
  group: rag-mungil-harvest
  cancel-in-progress: false

jobs:
  # TAHAP 1: Crawling & Harvesting secara paralel di tiap node matrix
  # Tidak ada git push di tahap ini sehingga kebal race-condition!
  harvest-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        domain:
          - 01_rag_scraping

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Harvest Domain (${{ matrix.domain }})
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m core.crawler_engine --domain ${{ matrix.domain }}

      # Simpan output raw data dan history domain ini sebagai artifact sementara
      - name: Upload Harvested Artifact
        uses: actions/upload-artifact@v4
        with:
          name: harvest-data-${{ matrix.domain }}
          path: |
            domains/${{ matrix.domain }}/raw/
            domains/${{ matrix.domain }}/exploration_history.json
          retention-days: 1
          if-no-files-found: ignore

  # TAHAP 2: Agregasi, Normalisasi Bersih (DATA_CLEANER), dan Single Atomic Git Commit
  # Hanya berjalan setelah SEMUA node matrix harvest selesai
  aggregate-and-commit:
    needs: harvest-matrix
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Download semua artefak dari tiap matrix job
      - name: Download All Harvested Artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts

      # Susun kembali file raw & history ke folder masing-masing domain secara presisi
      # Menghindari asumsi LCA path upload-artifact@v4
      - name: Reassemble Domain Artifacts
        run: |
          if [ -d "downloaded-artifacts" ]; then
            for artifact_dir in downloaded-artifacts/*; do
              if [ -d "$artifact_dir" ]; then
                folder_name=$(basename "$artifact_dir")
                # Ekstrak nama domain dari pola 'harvest-data-<domain>'
                domain_id="${folder_name#harvest-data-}"
                
                if [ -n "$domain_id" ] && [ "$domain_id" != "$folder_name" ]; then
                  echo "📂 Menyusun ulang artefak untuk domain: $domain_id"
                  mkdir -p "domains/$domain_id/raw"
                  
                  # Salin raw JSON files jika ada
                  if [ -d "$artifact_dir/raw" ]; then
                    cp -rf "$artifact_dir/raw/"* "domains/$domain_id/raw/" 2>/dev/null || true
                  elif [ -d "$artifact_dir/domains/$domain_id/raw" ]; then
                    cp -rf "$artifact_dir/domains/$domain_id/raw/"* "domains/$domain_id/raw/" 2>/dev/null || true
                  fi
                  
                  # Salin exploration_history.json jika ada
                  if [ -f "$artifact_dir/exploration_history.json" ]; then
                    cp -f "$artifact_dir/exploration_history.json" "domains/$domain_id/" 2>/dev/null || true
                  elif [ -f "$artifact_dir/domains/$domain_id/exploration_history.json" ]; then
                    cp -f "$artifact_dir/domains/$domain_id/exploration_history.json" "domains/$domain_id/" 2>/dev/null || true
                  fi
                fi
              fi
            done
          fi

      - name: Run Data Cleaner & Normalizer
        run: |
          python DATA_CLEANER.py

      - name: Single Atomic Commit & Push
        run: |
          git config --global user.name "Mungil RAG Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add domains/ storage_final/

          if git diff --staged --quiet; then
            echo "Tidak ada data baru pada putaran ini."
          else
            git commit -m "chore(rag): auto-harvest gold-tier techniques [skip ci]"
            # Retry loop resilient jika ada push konkuren
            for i in {1..3}; do
              git pull --rebase origin main && git push origin main && break || sleep 5
            done
          fi

      - name: Send Telegram Notification
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python core/notifier.py

