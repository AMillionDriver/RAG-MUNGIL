name: RAG-MUNGIL Auto Harvester

on:
  schedule:
    # Berjalan otomatis setiap 2 jam sekali
    - cron: '0 */2 * * *'
  workflow_dispatch: # Tombol manual trigger dari HP

concurrency:
  group: rag-mungil-harvest
  cancel-in-progress: false

jobs:
  harvest-matrix:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        domain:
          - 01_rag_scraping

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Harvest Domain (${{ matrix.domain }})
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m core.crawler_engine --domain ${{ matrix.domain }}

      - name: Run Data Cleaner & Normalizer
        run: |
          python DATA_CLEANER.py

      - name: Auto Commit & Push Clean Data
        run: |
          git config --global user.name "Mungil RAG Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add domains/ storage_final/
          
          if git diff --staged --quiet; then
            echo "Tidak ada data baru pada putaran ini."
          else
            git commit -m "chore(rag): auto-harvest gold-tier techniques [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
